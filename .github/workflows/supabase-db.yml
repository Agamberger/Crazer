name: GitOps - Supabase Database Migrations

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db.yml'

env:
  # Même version que la devDependency `supabase` de package.json.
  # Ne jamais revenir à `latest` : les nouvelles versions changent le comportement
  # par défaut (ex. `db push` cible la base locale), ce qui casse le déploiement.
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  lint-migrations:
    name: Lint & Verify Migrations (PR)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: 🚀 Start local Supabase stack
        run: supabase start

      - name: 🔍 Lint database migrations
        run: supabase db lint

      - name: 🛡️ Run pgTAP RLS tests
        run: supabase test db

  deploy-migrations:
    name: Deploy Migrations to Supabase (Production)
    needs: lint-migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Environnement GitHub « production » : y ajouter des reviewers obligatoires pour
    # valider chaque déploiement de schéma (les secrets du dépôt restent accessibles).
    environment: production
    # Jamais deux déploiements de migrations en parallèle
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: 🚀 Push Migrations to Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secrets SUPABASE_ACCESS_TOKEN et/ou SUPABASE_DB_PASSWORD manquants : rien n'est déployé."
            exit 1
          fi
          supabase link --project-ref pqczmkchxhfufaufljxr
          echo "Migrations qui vont être appliquées :"
          supabase db push --linked --dry-run
          supabase db push --linked
